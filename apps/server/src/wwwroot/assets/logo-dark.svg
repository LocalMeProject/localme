<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="100%" height="100%" dir="rtl">
  <defs>
    <style>
      .brand-title {
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 56px;
        font-weight: 900;
        fill: #172824;
        text-anchor: end;
      }
      .brand-sub {
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 18px;
        font-weight: 500;
        fill: #4b5563;
        text-anchor: end;
      }
      .badge-text {
        font-family: 'Vazirmatn', -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #176b5b;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="760" height="200" fill="#f5f2ea" rx="20"/>

  <!-- Right Logo Mark (140x140 at x=590, y=30) -->
  <g transform="translate(590, 30)">
    <rect width="140" height="140" rx="24" fill="#f5f2ea"/>
    <g transform="scale(1.16667)">
      <polygon points="22,79 22,22 120,22 120,120 80,120 80,108.5 108.5,108.5 108.5,33.5 33.5,33.5 33.5,79" fill="#172824"/>
      <polygon points="21,79 65,79 65,50 106,50 106,91 94,91 94,62 77,62 77,91 21,91" fill="#176b5b"/>
    </g>
  </g>

  <!-- Persian Typography (Right-Aligned towards mark at x=560) -->
  <g>
    <text x="560" y="98" class="brand-title">لوکال می</text>
    <text x="560" y="142" class="brand-sub">پلتفرم ابری بک اند برای توسعه دهندگان</text>

    <!-- Status Pill on the Left -->
    <rect x="36" y="66" width="168" height="32" rx="16" fill="rgba(23, 107, 91, 0.12)" stroke="#176b5b" stroke-width="1.2"/>
    <circle cx="52" cy="82" r="4.5" fill="#176b5b"/>
    <text x="64" y="87" class="badge-text">۱۰۰٪ آپتایم · پایداری کامل</text>
  </g>
</svg>