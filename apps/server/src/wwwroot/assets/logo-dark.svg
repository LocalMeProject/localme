<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="100%" height="100%" dir="rtl">
  <defs>
    <style>
      .brand-persian-title {
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 56px;
        font-weight: 900;
        fill: #0f172a;
        text-anchor: end;
      }
      .brand-persian-sub {
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 18px;
        font-weight: 500;
        fill: #64748b;
        text-anchor: end;
      }
      .brand-badge-text {
        font-family: 'Vazirmatn', -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #047857;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="760" height="200" fill="#ffffff" rx="20"/>

  <!-- Right-Hand Logo Mark: RTL Primary Anchor (x=590, y=30, 140x140) -->
  <g transform="translate(590, 30)">
    <rect width="140" height="140" rx="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <g transform="scale(0.2734)">
      <!-- Lām Vertical -->
      <rect x="360" y="96" width="52" height="312" rx="10" fill="#059669"/>
      <!-- Baseline -->
      <rect x="100" y="356" width="312" height="52" rx="10" fill="#059669"/>
      <!-- Mīm Head -->
      <path fill-rule="evenodd" fill="#059669" d="
        M 100 148
        C 100 138 108 130 118 130
        L 306 130
        C 316 130 324 138 324 148
        L 324 356
        L 100 356
        Z
        M 152 182
        L 272 182
        L 272 304
        L 152 304
        Z
      "/>
    </g>
  </g>

  <!-- Left Persian Typography (Anchored Rightwards to the Logo Mark at x=560) -->
  <g>
    <!-- Brand Title: لوکال می (Zero Half-Space) -->
    <text x="560" y="98" class="brand-persian-title">لوکال می</text>

    <!-- Subtitle: پلتفرم ابری بک اند برای توسعه دهندگان -->
    <text x="560" y="142" class="brand-persian-sub">پلتفرم ابری بک اند برای توسعه دهندگان</text>

    <!-- Status Badge on Far Left (x=36, y=66) -->
    <rect x="36" y="66" width="168" height="32" rx="16" fill="rgba(5, 150, 105, 0.08)" stroke="#059669" stroke-width="1.2"/>
    <circle cx="52" cy="82" r="4.5" fill="#059669"/>
    <text x="64" y="87" class="brand-badge-text">۱۰۰٪ آپتایم · پایداری کامل</text>
  </g>
</svg>