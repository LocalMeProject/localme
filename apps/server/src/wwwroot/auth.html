<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ورود به سامانه | LocalMe</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background: var(--bg-main);">

  <header class="topbar">
    <div class="topbar-brand">
      <a href="/" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
        <span class="brand-badge">LM</span>
        <span class="brand-title">لوکال می</span>
      </a>
    </div>
    <div style="display: flex; gap: 8px;">
      <a href="/docs" class="btn-secondary" style="font-size: 13px;">مستندات فنی</a>
      <a href="/" class="btn-secondary" style="font-size: 13px;">بازگشت به صفحه اصلی</a>
    </div>
  </header>


  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div class="card" style="width: 100%; max-width: 460px; margin-bottom: 0;">
      <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 6px;">ورود به سامانه لوکال می</h2>
        <p id="auth-subtitle" style="font-size: 13px; color: var(--text-muted);">روش احراز هویت مورد نظر خود را انتخاب نمایید</p>
      </div>

      <!-- Auth Mode Selector Tabs -->
      <div style="display: flex; background: var(--bg-subtle); padding: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); margin-bottom: 20px;">
        <button type="button" id="tab-btn-otp" class="btn-primary" style="flex: 1; font-size: 13px; padding: 6px 4px; border-radius: 4px; justify-content: center;" onclick="switchAuthTab('otp')">
          پیامک تایید (پیش فرض)
        </button>
        <button type="button" id="tab-btn-userpass" class="btn-secondary" style="flex: 1; font-size: 13px; padding: 6px 4px; border-radius: 4px; justify-content: center;" onclick="switchAuthTab('userpass')">
          نام کاربری و رمز
        </button>
        <button type="button" id="tab-btn-projpass" class="btn-secondary" style="flex: 1; font-size: 13px; padding: 6px 4px; border-radius: 4px; justify-content: center;" onclick="switchAuthTab('projpass')">
          رمز اختصاصی پروژه
        </button>
      </div>

      <!-- TAB 1: Mobile OTP Form (Default) -->
      <div id="pane-otp">
        <form id="otp-form">
          <div style="margin-bottom: 14px;">
            <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px;">شماره موبایل</label>
            <input type="text" id="phone-input" class="input-field" placeholder="۰۹۱۲۰۰۰۰۰۰۰" required />
          </div>

          <div id="otp-code-group" style="display: none; margin-bottom: 14px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <label style="font-size: 13px; font-weight: 600;">کد تایید ۶ رقمی</label>
              <span id="countdown-label" style="font-size: 13px; color: var(--brand-dark);">۱۲۰ ثانیه</span>
            </div>
            <input type="text" id="code-input" class="input-field" placeholder="123456" maxlength="6" />
            <div id="test-code-hint" style="font-size: 13px; color: var(--brand-dark); margin-top: 6px; font-family: var(--font-persian);"></div>
          </div>

          <button type="submit" id="btn-submit-auth" class="btn-primary" style="width: 100%; padding: 10px;">
            دریافت کد تایید پیامکی
          </button>
        </form>
      </div>

      <!-- TAB 2: Username & Password Form -->
      <div id="pane-userpass" style="display: none;">
        <form id="form-userpass">
          <div style="margin-bottom: 14px;">
            <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px;">نام کاربری، ایمیل یا شماره موبایل</label>
            <input type="text" id="login-identifier" class="input-field" placeholder="نام کاربری، ایمیل یا شماره موبایل" required />
          </div>

          <div style="margin-bottom: 16px;">
            <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px;">کلمه عبور</label>
            <input type="password" id="login-password" class="input-field" placeholder="••••••••" required />
          </div>

          <div id="userpass-error-hint" style="display: none; font-size: 13px; color: var(--color-danger); margin-bottom: 12px; padding: 8px 12px; background: #fee2e2; border-radius: 4px;"></div>

          <button type="submit" id="btn-submit-userpass" class="btn-primary" style="width: 100%; padding: 10px;">
            ورود به پنل کاربری
          </button>
        </form>
      </div>

      <!-- TAB 3: Project-Scoped Credentials Form -->
      <div id="pane-projpass" style="display: none;">
        <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius-sm); padding: 12px; margin-bottom: 16px; font-size: 13px; color: #166534; line-height: 1.5;">
          <strong>دسترسی اختصاصی تک پروژه:</strong> با وارد کردن اسلاگ پروژه و رمز عبور اختصاصی آن، مستقیماً وارد محیط همان پروژه می شوید و دسترسی به حساب اصلی و سایر پروژه ها نخواهید داشت.
        </div>

        <form id="form-projpass">
          <div style="margin-bottom: 14px;">
            <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px;">شناسه یا اسلاگ پروژه</label>
            <input type="text" id="login-proj-slug" class="input-field" placeholder="مثال: my-store یا proj_a1b2c3d4" required />
          </div>

          <div style="margin-bottom: 16px;">
            <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px;">رمز عبور اختصاصی پروژه</label>
            <input type="password" id="login-proj-password" class="input-field" placeholder="رمز تعیین شده توسط مالک پروژه" required />
          </div>

          <div id="projpass-error-hint" style="display: none; font-size: 13px; color: var(--color-danger); margin-bottom: 12px; padding: 8px 12px; background: #fee2e2; border-radius: 4px;"></div>

          <button type="submit" id="btn-submit-projpass" class="btn-primary" style="width: 100%; padding: 10px;">
            ورود اختصاصی به محیط پروژه
          </button>
        </form>
      </div>

    </div>
  </main>

  <script>
    function showToast(message, type = 'info', duration = 3800) {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'toast-container';
        document.body.appendChild(container);
      }
      const toast = document.createElement('div');
      toast.className = `toast-message toast-${type}`;
      const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : type === 'warning' ? '⚠' : 'ℹ';
      toast.innerHTML = `<span class="toast-icon">${icon}</span><span class="toast-text">${String(message).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('toast-fadeout');
        setTimeout(() => toast.remove(), 280);
      }, duration);
    }
    window.showToast = showToast;
    window.alert = function(msg) { showToast(String(msg), 'info'); };

    // Tab Switching
    function switchAuthTab(tab) {
      const tabOtp = document.getElementById('tab-btn-otp');
      const tabUserpass = document.getElementById('tab-btn-userpass');
      const tabProjpass = document.getElementById('tab-btn-projpass');
      const paneOtp = document.getElementById('pane-otp');
      const paneUserpass = document.getElementById('pane-userpass');
      const paneProjpass = document.getElementById('pane-projpass');
      const subtitle = document.getElementById('auth-subtitle');

      tabOtp.className = 'btn-secondary';
      tabUserpass.className = 'btn-secondary';
      tabProjpass.className = 'btn-secondary';
      paneOtp.style.display = 'none';
      paneUserpass.style.display = 'none';
      paneProjpass.style.display = 'none';

      if (tab === 'otp') {
        tabOtp.className = 'btn-primary';
        paneOtp.style.display = 'block';
        subtitle.textContent = 'شماره موبایل خود را جهت دریافت کد تایید پیامکی وارد نمایید';
      } else if (tab === 'userpass') {
        tabUserpass.className = 'btn-primary';
        paneUserpass.style.display = 'block';
        subtitle.textContent = 'نام کاربری و کلمه عبور حساب کاربری خود را وارد فرمایید';
      } else if (tab === 'projpass') {
        tabProjpass.className = 'btn-primary';
        paneProjpass.style.display = 'block';
        subtitle.textContent = 'شناسه و رمز اختصاصی پروژه را وارد نمایید';
      }
    }

    function fillUserPass(username, password) {
      document.getElementById('login-identifier').value = username;
      document.getElementById('login-password').value = password;
    }

    // 1. OTP Login Implementation
    async function quickOtpLogin(phone, redirectPath) {
      phoneInput.value = phone;
      submitBtn.disabled = true;
      submitBtn.textContent = 'در حال ورود...';
      try {
        const res = await fetch('/_baas/v1/auth/otp/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ Phone: phone, Channel: 'sms' })
        });
        const data = await res.json();
        if (data.success && data.codeForTesting) {
          codeInput.value = data.codeForTesting;
          codeGroup.style.display = 'block';
          otpSent = true;
          const vRes = await fetch('/_baas/v1/auth/otp/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ Phone: phone, Code: data.codeForTesting })
          });
          const vData = await vRes.json();
          if (vData.success) {
            if (vData.tokens?.accessToken) {
              localStorage.setItem('localme_token', vData.tokens.accessToken);
            }
            window.location.href = redirectPath;
            return;
          }
        }
        showToast(data.message || 'خطا در ارسال پیامک ورود.', 'error');
      } catch {
        showToast('خطای ارتباط با سرور.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'دریافت کد تایید پیامکی';
      }
    }

    const form = document.getElementById('otp-form');
    const phoneInput = document.getElementById('phone-input');
    const codeGroup = document.getElementById('otp-code-group');
    const codeInput = document.getElementById('code-input');
    const submitBtn = document.getElementById('btn-submit-auth');
    const testHint = document.getElementById('test-code-hint');
    let otpSent = false;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = phoneInput.value.trim();

      if (!otpSent) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'در حال ارسال کد...';
        try {
          const res = await fetch('/_baas/v1/auth/otp/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ Phone: phone, Channel: 'sms' })
          });
          const data = await res.json();
          if (data.success) {
            otpSent = true;
            codeGroup.style.display = 'block';
            submitBtn.textContent = 'تایید و ورود به پنل';
            if (data.codeForTesting) {
              codeInput.value = data.codeForTesting;
              testHint.textContent = `کد پیامک شده تستی: ${data.codeForTesting}`;
            }
          } else {
            showToast(data.message || 'خطا در ارسال پیامک', 'error');
          }
        } catch {
          showToast('خطای ارتباط با سرور.', 'error');
        } finally {
          submitBtn.disabled = false;
        }
      } else {
        const code = codeInput.value.trim();
        submitBtn.disabled = true;
        submitBtn.textContent = 'در حال بررسی...';
        try {
          const res = await fetch('/_baas/v1/auth/otp/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ Phone: phone, Code: code })
          });
          const data = await res.json();
          if (data.success) {
            if (data.tokens?.accessToken) {
              localStorage.setItem('localme_token', data.tokens.accessToken);
            }
            if (data.user?.role === 0 || data.user?.role === 1 || data.user?.role === 'Admin' || data.user?.role === 'Operator') {
              window.location.href = '/admin';
            } else {
              window.location.href = '/panel';
            }
          } else {
            showToast(data.message || 'کد نامعتبر است', 'error');
          }
        } catch {
          showToast('خطای تایید.', 'error');
        } finally {
          submitBtn.disabled = false;
        }
      }
    });

    // 2. Username & Password Login Implementation
    const formUserpass = document.getElementById('form-userpass');
    const userpassError = document.getElementById('userpass-error-hint');
    const btnSubmitUserpass = document.getElementById('btn-submit-userpass');

    formUserpass.addEventListener('submit', async (e) => {
      e.preventDefault();
      userpassError.style.display = 'none';
      btnSubmitUserpass.disabled = true;
      btnSubmitUserpass.textContent = 'در حال احراز هویت...';

      const username = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/_baas/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          if (data.tokens?.accessToken) {
            localStorage.setItem('localme_token', data.tokens.accessToken);
          }
          if (data.user?.role === 0 || data.user?.role === 1 || data.user?.role === 'Admin' || data.user?.role === 'Operator') {
            window.location.href = '/admin';
          } else {
            window.location.href = '/panel';
          }
        } else {
          userpassError.textContent = data.error || data.message || 'نام کاربری یا کلمه عبور نادرست است.';
          userpassError.style.display = 'block';
        }
      } catch (err) {
        userpassError.textContent = 'خطای ارتباط با سرور رخ داد.';
        userpassError.style.display = 'block';
      } finally {
        btnSubmitUserpass.disabled = false;
        btnSubmitUserpass.textContent = 'ورود به پنل کاربری';
      }
    });

    // 3. Project Scoped Login Implementation
    const formProjpass = document.getElementById('form-projpass');
    const projpassError = document.getElementById('projpass-error-hint');
    const btnSubmitProjpass = document.getElementById('btn-submit-projpass');

    formProjpass.addEventListener('submit', async (e) => {
      e.preventDefault();
      projpassError.style.display = 'none';
      btnSubmitProjpass.disabled = true;
      btnSubmitProjpass.textContent = 'در حال بررسی دسترسی...';

      const projectSlug = document.getElementById('login-proj-slug').value.trim();
      const password = document.getElementById('login-proj-password').value;

      try {
        const res = await fetch('/_baas/v1/auth/project-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectSlug, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          if (data.tokens?.accessToken) {
            localStorage.setItem('localme_token', data.tokens.accessToken);
          }
          window.location.href = '/panel';
        } else {
          projpassError.textContent = data.error || data.message || 'شناسه یا رمز عبور اختصاصی پروژه نادرست است.';
          projpassError.style.display = 'block';
        }
      } catch (err) {
        projpassError.textContent = 'خطای ارتباط با سرور رخ داد.';
        projpassError.style.display = 'block';
      } finally {
        btnSubmitProjpass.disabled = false;
        btnSubmitProjpass.textContent = 'ورود اختصاصی به محیط پروژه';
      }
    });
  </script>
</body>
</html>
