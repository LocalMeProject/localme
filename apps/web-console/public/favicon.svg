<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container: Architectural Obsidian Slate Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#0b0f19" stroke="#1e293b" stroke-width="4"/>

  <!-- Authentic Persian Bannai Kufic Ligature 'لم' (LocalMe) -->
  <g fill="#10b981">
    <!-- Lām: Tall Vertical Stem (Right Column) -->
    <rect x="360" y="96" width="52" height="312" rx="10"/>

    <!-- Baseline: Connecting Lām and Mīm -->
    <rect x="100" y="356" width="312" height="52" rx="10"/>

    <!-- Mīm: Precision Square Head (Left Box) -->
    <path fill-rule="evenodd" d="
      M 100 148
      C 100 138 108 130 118 130
      L 306 130
      C 316 130 324 138 324 148
      L 324 356
      L 100 356
      Z
      M 152 182
      L 272 182
      L 272 304
      L 152 304
      Z
    "/>
  </g>
</svg>